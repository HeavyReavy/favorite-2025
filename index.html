<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="style.css" />
	<title>Фаворит</title>
</head>

<body>
	<div class="container">

		<header class="header">
			<img class="logo" src="images/logo-top.svg" alt="logo" />
			<div class="search-line">
				<input type="text" class="search" placeholder="Type something here..." />
				<button class="button button-yellow add">Добавить</button>
				<button class="button button-yellow what">Что посмотреть?</button>
			</div>
		</header>

		<main class="main">
			<ul class="movies">
				<li>
					<article class="movie-card">
						<img class="movie-card-poster" src="images/kill-bill.jpg" alt="УБить билла" width="418" height="213">
						<span class="movie-card-year">2003</span>
						<h4 class="movie-card-title">Убить Билла, часть 1</h4>
						<span class="movie-card-style">боевик, триллер, драма, криминал</span>
						<div class="movie-card-buttons">
							<button class="movie-card-like">
								<svg class="like" width="24" height="24" viewBox="0 0 24 24" fill="none"
									xmlns="http://www.w3.org/2000/svg">
									<path
										d="M3.34255 7.7779C3.5687 7.23194 3.90017 6.73586 4.31804 6.31799C4.7359 5.90012 5.23198 5.56865 5.77795 5.3425C6.32392 5.11635 6.90909 4.99995 7.50004 4.99995C8.09099 4.99995 8.67616 5.11635 9.22213 5.3425C9.7681 5.56865 10.2642 5.90012 10.682 6.31799L12 7.63599L13.318 6.31799C14.162 5.47407 15.3066 4.99997 16.5 4.99997C17.6935 4.99997 18.8381 5.47407 19.682 6.31799C20.526 7.16191 21.0001 8.30651 21.0001 9.49999C21.0001 10.6935 20.526 11.8381 19.682 12.682L12 20.364L4.31804 12.682C3.90017 12.2641 3.5687 11.7681 3.34255 11.2221C3.1164 10.6761 3 10.0909 3 9.49999C3 8.90904 3.1164 8.32387 3.34255 7.7779Z"
										stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
								</svg>
							</button>
							<button class="movie-card-look">Просмотрено
								<svg class="look" width="28" height="28" viewBox="0 0 28 28" fill="none"
									xmlns="http://www.w3.org/2000/svg">
									<path d="M6.125 15.125L10.625 19.625L21.875 8.375" stroke-width="3" stroke-linecap="round"
										stroke-linejoin="round" />
								</svg>
							</button>
						</div>
					</article>
				</li>
				<li>
					<article class="movie-card">
						<img class="movie-card-poster" src="images/interstellar.jpg" alt="Интерстеллар" width="418" height="213">
						<span class="movie-card-year">2014</span>
						<h4 class="movie-card-title">Интерстеллар</h4>
						<span class="movie-card-style">научная фантастика, приключения</span>
						<div class="movie-card-buttons">
							<button class="movie-card-like">
								<svg class="like" width="24" height="24" viewBox="0 0 24 24" fill="none"
									xmlns="http://www.w3.org/2000/svg">
									<path
										d="M3.34255 7.7779C3.5687 7.23194 3.90017 6.73586 4.31804 6.31799C4.7359 5.90012 5.23198 5.56865 5.77795 5.3425C6.32392 5.11635 6.90909 4.99995 7.50004 4.99995C8.09099 4.99995 8.67616 5.11635 9.22213 5.3425C9.7681 5.56865 10.2642 5.90012 10.682 6.31799L12 7.63599L13.318 6.31799C14.162 5.47407 15.3066 4.99997 16.5 4.99997C17.6935 4.99997 18.8381 5.47407 19.682 6.31799C20.526 7.16191 21.0001 8.30651 21.0001 9.49999C21.0001 10.6935 20.526 11.8381 19.682 12.682L12 20.364L4.31804 12.682C3.90017 12.2641 3.5687 11.7681 3.34255 11.2221C3.1164 10.6761 3 10.0909 3 9.49999C3 8.90904 3.1164 8.32387 3.34255 7.7779Z"
										stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
								</svg>
							</button><a></a>
							<button class="movie-card-look">Просмотрено
								<svg class="look" width="28" height="28" viewBox="0 0 28 28" fill="none"
									xmlns="http://www.w3.org/2000/svg">
									<path d="M6.125 15.125L10.625 19.625L21.875 8.375" stroke-width="3" stroke-linecap="round"
										stroke-linejoin="round" />
								</svg>
							</button>
						</div>
					</article>
				</li>
			</ul>
		</main>
 
		<footer class="footer">
			<img class="logo-bottom" src="./images/logo-bottom.svg" alt="Фаворит" />
			<p class="copy">&copy; 2022 ООО “Фаворит”</p>
			<button class="arrow-up">
				<svg class="arrow-icon" width="24" height="24" viewBox="0 0 24 24" fill="none"
					xmlns="http://www.w3.org/2000/svg">
					<path d="M5 15L12 8L19 15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
				</svg>
			</button>
		</footer>

	</div>
	</svg>
<script src="main.js"></script>
</body>

</html>
