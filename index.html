<!DOCTYPE html>
<html class="no-js" lang="ru" xmlns="http://www.w3.org/1999/html">
<head>
  <meta charset="utf-8" />
  <title>Фаворит</title>

  <meta name="description" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="shortcut icon" href="assets/images/logo.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="normalize.css" />
  <link rel="stylesheet" href="main.css" />

  <meta name="theme-color" content="#fafafa" />
</head>

<body>
<div class="bg-overlay"></div>
<div class="container">
  <header class="header">
    <img class="header__logo" src="./images/logo-top.svg" alt="logo" />
    <div class="header__search">
      <input type="text" class="search search--short" placeholder="Type something here..." />
      <button type="button" class="add-button button button--yellow">Добавить</button>
      <button type="button" class="what-watch-button button button--yellow">Что посмотреть?</button>
    </div>
  </header>
  <main class="main">
    <!-- <div class="movie-list-header">
      <select class="sort-select">
        <option value="name-a-z">Название: А-Я</option>
        <option value="name-z-a">Название: Я-А</option>
      </select>
    </div> -->
    <ul class="movies-list"></ul>
  </main>
  <footer class="footer">
    <img class="footer__logo" src="./images/logo-bottom.svg" alt="Фаворит" />
    <p class="footer__copy">&copy; 2026 ООО “Фаворит”</p>

    <button type="button" class="footer__arrow arrow-up">
      <svg
        class="arrow-up__icon"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="M5 15L12 8L19 15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </footer>
</div>

<section class="bookmark-overlay">
  <form name="create-movie-record" class="bookmark-overlay__form add-bookmark">
    <h2 class="add-bookmark__title">Создание записи</h2>
    <div class="add-bookmark__input-wrap">
      <label class="add-bookmark__label" for="movie-title">Название</label>
      <input class="add-bookmark__input" id="movie-title" name="name" type="text" placeholder="Type something here..." />
    </div>
    <div class="add-bookmark__input-wrap">
      <label class="add-bookmark__label" for="movie-poster">Постер</label>
      <input class="add-bookmark__input add-bookmark__input--file" id="movie-poster" name="poster" type="file" />
    </div>
    <div class="add-bookmark__input-wrap">
      <label class="add-bookmark__label" for="movie-year">Год выпуска</label>
      <input class="add-bookmark__input" id="movie-year" name="releaseYear" type="number" placeholder="Type something here..." />
    </div>
    <div class="add-bookmark__input-wrap">
      <label class="add-bookmark__label" for="genres">Жанры</label>
      <input class="add-bookmark__input" id="genres" name="genres" type="text" placeholder="Type something here..." />
    </div>
    <div class="add-bookmark__input-wrap">
      <label class="add-bookmark__label" for="description">Описание</label>
      <textarea class="add-bookmark__input" id="description" name="description" placeholder="Type something here..."></textarea>
    </div>
    <div class="add-bookmark__buttons">
      <button id="cancel-bookmark" type="button" class="cancel-button add-bookmark__btn button">Отменить</button>
      <button id="save-bookmark" type="submit" class="save-button add-bookmark__btn button">Сохранить</button>
    </div>
  </form>
</section>

<div class="overlay-container">
</div>

<div class="easter-egg"></div>

</body>
</html>
